name: Build and Release

on:
  push:
    branches: [main]
    paths:
      - "config.py"
  # Так тести можна прогнати на вимогу, нічого не публікуючи. Без цього
  # єдиний спосіб дізнатися, чи набір узагалі проходить на Linux, - підняти
  # версію і злити в main, тобто **опублікувати реліз**. Саме тому два
  # зламані тестові модулі дійшли до main і лежали там непоміченими: job
  # запускається лише тоді, коли вже пізно.
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.14"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # PySide6 installs from a wheel and still cannot load: the wheel
      # carries Qt, not the system libraries Qt links against, and a runner
      # image has no reason to ship them. Without these, `from
      # PySide6.QtWidgets import ...` raises `libEGL.so.1: cannot open
      # shared object file` and every widget test skips - silently, on a
      # green job.
      #
      # Installed one at a time and tolerantly: several of these were
      # renamed with a `t64` suffix in Ubuntu 24.04, so a single
      # `apt-get install` of the whole list breaks the job the day the
      # runner image moves. What must hold is checked below, by importing
      # Qt rather than by trusting the package names.
      - name: Install the system libraries Qt links against
        run: |
          sudo apt-get update
          for pkg in \
            libegl1 libgl1 libdbus-1-3 libnss3 libgbm1 libdrm2 \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xkb1 \
            libxcomposite1 libxdamage1 libxrandr2 libxtst6 \
            libpango-1.0-0 libcairo2 \
            libasound2t64 libasound2 \
            libatk1.0-0t64 libatk1.0-0 \
            libatk-bridge2.0-0t64 libatk-bridge2.0-0 \
            libcups2t64 libcups2 \
          ; do
            sudo apt-get install -y --no-install-recommends "$pkg" \
              || echo "not on this image, skipped: $pkg"
          done

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-timeout

      # A hard gate, on purpose. Every Qt test in this suite guards its
      # import and skips when Qt is missing - which is right for a
      # contributor's machine and wrong for CI, where it turns "563 tests
      # did not run" into a green tick. If Qt cannot load here, the job says
      # so instead of passing.
      - name: Check Qt actually loads
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          xvfb-run -a python - <<'EOF'
          from PySide6.QtWidgets import QApplication  # noqa: F401
          from audit.driver import available
          ok, why = available()
          print(f"QtWebEngine available: {ok} {why}")
          EOF

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
          QTWEBENGINE_CHROMIUM_FLAGS: --no-sandbox --disable-gpu --disable-software-rasterizer
        run: xvfb-run -a python -m pytest tests/

  release:
    needs: test
    # Ручний запуск - це прогін тестів, а не випуск. Публікація лишається
    # подією push у main зі зміненим `config.py`, як і була.
    if: github.event_name == 'push'
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Read version
        id: version
        run: echo "version=$(python -c 'import config; print(config.APP_VERSION)')" >> "$GITHUB_OUTPUT"

      - name: Check if tag already exists
        id: tag_check
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.tag_check.outputs.exists == 'false'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build CLI bundle
        if: steps.tag_check.outputs.exists == 'false'
        run: pyinstaller packaging/XAnalyze-cli.spec --noconfirm --distpath dist

      - name: Build GUI bundle
        if: steps.tag_check.outputs.exists == 'false'
        run: pyinstaller packaging/XAnalyze.spec --noconfirm --distpath dist

      - name: Package CLI
        if: steps.tag_check.outputs.exists == 'false'
        run: |
          cd dist
          tar -czf xanalyze-cli-macos-arm64.tar.gz xanalyze-cli/

      - name: Package GUI
        if: steps.tag_check.outputs.exists == 'false'
        run: |
          cd dist
          zip -r XAnalyze.app.zip XAnalyze.app/

      - name: Create tag and release
        if: steps.tag_check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: XAnalyze ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            dist/xanalyze-cli-macos-arm64.tar.gz
            dist/XAnalyze.app.zip

      - name: Skip (version already released)
        if: steps.tag_check.outputs.exists == 'true'
        run: echo "Version ${{ steps.version.outputs.version }} already has a tag — skipping."
