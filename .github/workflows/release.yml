name: Build and Release

on:
  push:
    branches: [main]
    paths:
      - "config.py"

env:
  PYTHON_VERSION: "3.14"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-timeout

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
          QTWEBENGINE_CHROMIUM_FLAGS: --no-sandbox --disable-gpu --disable-software-rasterizer
        run: xvfb-run -a python -m pytest tests/

  release:
    needs: test
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Read version
        id: version
        run: echo "version=$(python -c 'import config; print(config.APP_VERSION)')" >> "$GITHUB_OUTPUT"

      - name: Check if tag already exists
        id: tag_check
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.tag_check.outputs.exists == 'false'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build CLI bundle
        if: steps.tag_check.outputs.exists == 'false'
        run: pyinstaller packaging/XAnalyze-cli.spec --noconfirm --distpath dist

      - name: Build GUI bundle
        if: steps.tag_check.outputs.exists == 'false'
        run: pyinstaller packaging/XAnalyze.spec --noconfirm --distpath dist

      - name: Package CLI
        if: steps.tag_check.outputs.exists == 'false'
        run: |
          cd dist
          tar -czf xanalyze-cli-macos-arm64.tar.gz xanalyze-cli/

      - name: Package GUI
        if: steps.tag_check.outputs.exists == 'false'
        run: |
          cd dist
          zip -r XAnalyze.app.zip XAnalyze.app/

      - name: Create tag and release
        if: steps.tag_check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: XAnalyze ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            dist/xanalyze-cli-macos-arm64.tar.gz
            dist/XAnalyze.app.zip

      - name: Skip (version already released)
        if: steps.tag_check.outputs.exists == 'true'
        run: echo "Version ${{ steps.version.outputs.version }} already has a tag — skipping."
